services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multimodal_api
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./bulk_ingest.py:/app/bulk_ingest.py
    depends_on:
      - qdrant
    restart: always

  frontend:
    build: .
    container_name: multimodal_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend.py:/app/frontend.py
    command: [ "streamlit", "run", "frontend.py", "--server.port=8501", "--server.address=0.0.0.0" ]
    depends_on:
      - api
    restart: always

volumes:
  qdrant_storage: